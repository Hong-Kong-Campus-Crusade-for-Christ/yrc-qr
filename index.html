<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YRC2026 Program</title>
    <style>
        /* --- MOBILE FIRST MINIMALIST CSS --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; 
        }

        #app-container {
            /* FIX 1: Adjusted width to create more space on the edges */
            /* This subtracts 50px from full width (25px gap on each side) */
            width: calc(100% - 50px); 
            max-width: 500px;
            
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            opacity: 0; 
            transition: opacity 0.8s ease-in;
            text-align: left;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
        }

        #message-content {
            font-size: 1.1rem;
            line-height: 1.6;
            white-space: pre-wrap; 
            color: #cccccc;
        }

        .icon {
            font-size: 3rem;
            display: block;
            text-align: center;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

    <div id="app-container">
        <div id="dynamic-content">
        </div>
    </div>

    <script>
        // ================= CONFIGURATION =================
        
        // DATE MUST BE IN UTC
        const REVEAL_DATE = "2026-01-01T19:03:00+08:00"; 
        const EXPIRY_DATE = "2026-01-05T00:00:00+08:00";

        // FIX 2: Define your custom titles here
        const PAGE_TITLES = {
            "1": "身<br/>Physical",
            "2": "身<br/>Physical",
            "3": "心<br/>Mental",
            "4": "社<br/>Social",
            "5": "靈<br/>Spiritual"
        };

        // =================================================

        const container = document.getElementById('app-container');
        const contentBox = document.getElementById('dynamic-content');

        async function init() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            const now = new Date();
            
            const start = new Date(REVEAL_DATE);
            const end = new Date(EXPIRY_DATE);

            if (now < start) {
                renderState("early");
            } else if (now > end) {
                renderState("expired");
            } else {
                // Check if ID exists in our new TITLES list
                if(id && PAGE_TITLES[id]) {
                    await fetchAndShowMessage(id);
                } else {
                    renderState("error");
                }
            }

            container.style.opacity = 1;
        }

        // async function getGlobalTime() {
        //     try {
        //         const r1 = await fetch('https://worldtimeapi.org/api/timezone/Etc/UTC');
        //         const d1 = await r1.json();
        //         return new Date(d1.utc_datetime);
        //     } catch (e) {
        //         try {
        //             const r2 = await fetch('https://timeapi.io/api/Time/current/zone?timeZone=UTC');
        //             const d2 = await r2.json();
        //             return new Date(d2.dateTime + "Z");
        //         } catch (e2) {
        //             return new Date();
        //         }
        //     }
        // }

        async function fetchAndShowMessage(id) {
            try {
                const response = await fetch(`message${id}.txt`);
                
                if (response.ok) {
                    const text = await response.text();
                    
                    // Look up the title from our configuration list
                    const titleText = PAGE_TITLES[id] || `Message ${id}`;

                    contentBox.innerHTML = `
                        <h1>${titleText}</h1>
                        <div id="message-content">${text}</div>
                    `;
                } else {
                    renderState("error");
                }
            } catch (e) {
                renderState("error");
            }
        }

        function renderState(state) {
            if (state === "early") {
                contentBox.innerHTML = `
                    <h1>Radical Rest</h1>`;
            } else if (state === "expired") {
                contentBox.innerHTML = `
                    <h1>Expired</h1>`;
            } else {
                contentBox.innerHTML = `
                    <span class="icon">❓</span>
                    <h1>Error</h1>
                    <div id="message-content" style="text-align:center">
                        Invalid QR Code or missing file.
                    </div>`;
            }
        }

        init();
    </script>
</body>
</html>
